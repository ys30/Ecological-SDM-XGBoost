name: Capture SDM runtime package versions

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/32_capture_sdm_environment.R'
      - '.github/workflows/capture-sdm-environment.yml'

permissions:
  contents: read

jobs:
  environment-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::xgboost
            any::maxnet
            any::pROC
            any::ggplot2
      - name: Capture installed R and package versions
        run: Rscript scripts/32_capture_sdm_environment.R
      - uses: actions/upload-artifact@v4
        with:
          name: sdm-runtime-versions
          path: results/sdm_environment_versions.csv
          if-no-files-found: error
