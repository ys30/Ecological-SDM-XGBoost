name: EMS v6.22 C2b AP sensitivity
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - '.github/workflows/ems-v622-c2b-ap-sensitivity.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  sensitivity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scikit-learn
      - name: Retrieve validated C2b outer predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/v622
          gh run download 43269143843 -R ys30/Ecological-SDM-XGBoost -n ems-v622-c2b-oof-grid4_s2026_b0-43269143843 -D results/v622
          gh run download 43269143843 -R ys30/Ecological-SDM-XGBoost -n ems-v622-c2b-oof-km15_b0-43269143843 -D results/v622
      - name: AP by taxon and nonfallback probability scores
        run: python -m experiments.v622.analyze_c2b_ap_sensitivity
      - uses: actions/upload-artifact@v4
        with:
          name: ems-v622-c2b-ap-sensitivity-${{ github.run_id }}
          path: |
            results/v622/c2b_ap_heterogeneity_nonfallback_cells.csv
            results/v622/c2b_ap_heterogeneity_nonfallback.json
          if-no-files-found: error
