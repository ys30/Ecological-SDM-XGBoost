name: EMS v6.22 AUC feasibility diagnostic
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/audit_auc_feasibility.py'
      - 'experiments/v622/audit_inner_species.py'
      - 'experiments/v622/spatial_inner_folds.py'
      - '.github/workflows/ems-v622-auc-feasibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scikit-learn
      - run: python -m experiments.v622.audit_inner_species
      - run: python -m experiments.v622.audit_auc_feasibility
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ems-v622-auc-feasibility
          path: |
            results/v622/inner_species_class_counts.csv
            results/v622/inner_auc_feasibility_by_species.csv
            results/v622/inner_auc_feasibility_pairs.csv
            results/v622/inner_auc_feasibility_summary.json
          if-no-files-found: warn
