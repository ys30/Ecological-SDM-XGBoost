name: EMS v6.22 spatial inner folds
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/spatial_inner_folds.py'
      - 'experiments/v622/test_spatial_inner_folds.py'
      - 'experiments/v622/smoke_spatial_inner.py'
      - '.github/workflows/ems-v622-spatial-inner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spatial-inner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scikit-learn
      - run: python -m unittest discover -s experiments/v622 -p 'test_spatial_inner_folds.py' -v
      - run: python -m experiments.v622.smoke_spatial_inner
