name: EMS v6.22 C1 grid4 taxon bootstrap
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - '.github/workflows/ems-v622-c1-grid4-bootstrap.yml'
      - 'experiments/v622/bootstrap_c1_grid4_descriptive.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  bootstrap:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas
      - name: Retrieve immutable descriptive results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42957373610 -R ys30/Ecological-SDM-XGBoost -n ems-v622-c1-grid4-descriptive-42957373610 -D results/v622
      - name: Bootstrap paired AUC over taxa
        run: python -m experiments.v622.bootstrap_c1_grid4_descriptive
      - uses: actions/upload-artifact@v4
        with:
          name: ems-v622-c1-grid4-bootstrap-${{ github.run_id }}
          path: results/v622/c1_grid4_descriptive_taxon_bootstrap.json
          if-no-files-found: error

  km15-bootstrap:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas
      - name: Retrieve km15 descriptive results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42961361405 -R ys30/Ecological-SDM-XGBoost -n ems-v622-c1-km15-descriptive-42961361405 -D results/v622
      - name: Bootstrap km15 paired AUC over taxa
        run: python -m experiments.v622.bootstrap_c1_km15_descriptive
      - uses: actions/upload-artifact@v4
        with:
          name: ems-v622-c1-km15-bootstrap-${{ github.run_id }}
          path: results/v622/c1_km15_descriptive_taxon_bootstrap.json
          if-no-files-found: error

  two-design-synthesis:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas
      - name: Download immutable grid4 and km15 descriptive cells
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42957373610 -R ys30/Ecological-SDM-XGBoost -n ems-v622-c1-grid4-descriptive-42957373610 -D results/v622
          gh run download 42961361405 -R ys30/Ecological-SDM-XGBoost -n ems-v622-c1-km15-descriptive-42961361405 -D results/v622
      - name: Two-design paired taxon bootstrap and SESOI check
        run: python -m experiments.v622.analyze_c1_two_designs
      - uses: actions/upload-artifact@v4
        with:
          name: ems-v622-c1-two-design-${{ github.run_id }}
          path: |
            results/v622/c1_two_design_tuned_descriptive.json
            results/v622/c1_two_design_tuned_cells.csv
          if-no-files-found: error

  fixed-vs-tuned-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas
      - name: Retrieve paired C1a/C1b cells
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42964164261 -R ys30/Ecological-SDM-XGBoost -n ems-v622-c1-fixed-vs-tuned-42964164261 -D results/v622
      - name: Paired taxon bootstrap for C1a and C1b
        run: python -m experiments.v622.bootstrap_c1_fixed_vs_tuned
      - uses: actions/upload-artifact@v4
        with:
          name: ems-v622-c1-fixed-vs-tuned-bootstrap-${{ github.run_id }}
          path: results/v622/c1_fixed_vs_tuned_bootstrap.json
          if-no-files-found: error
