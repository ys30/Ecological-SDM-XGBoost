name: v6.24 matched logistic and MaxEnt refits
on:
  push:
    branches: [research/v6.22-nested-spatial-tuning]
    paths:
      - '.github/workflows/v624-comparators.yml'
      - 'scripts/128_v624_comparator_inputs.py'
      - 'scripts/129_v624_matched_comparators.R'
permissions:
  contents: read
jobs:
  comparators:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 xgboost-cpu==3.1.3
      - run: Rscript -e 'install.packages(c("glmnet", "maxnet"))'
      - run: python scripts/128_v624_comparator_inputs.py
      - run: Rscript scripts/129_v624_matched_comparators.R
      - uses: actions/upload-artifact@v4
        with:
          name: v624-matched-comparator-outputs
          path: results/v624_comparators/
          if-no-files-found: error
