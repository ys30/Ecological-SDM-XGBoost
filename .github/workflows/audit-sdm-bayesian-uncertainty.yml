name: Audit Bayesian species uncertainty
on:
  push:
    paths:
      - 'scripts/19_bayes_species_uncertainty.py'
      - '.github/workflows/audit-sdm-bayesian-uncertainty.yml'
      - 'results/bayes_spatial_cv_predictions.csv'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compute held-out species posterior interval summaries
        run: python scripts/19_bayes_species_uncertainty.py
      - name: Publish uncertainty audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/bayes_species_uncertainty_summary.csv
          if ! git diff --cached --quiet; then
            git commit -m "Publish Bayesian species uncertainty summary"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
