name: Alternative spatial GLM baselines
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/68_alternative_spatial_glm_baselines.py'
      - '.github/workflows/alternative-spatial-glm-baselines.yml'
permissions:
  contents: read
jobs:
  fit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn tabulate
      - run: python scripts/64_alternative_spatial_partition.py
      - run: python scripts/68_alternative_spatial_glm_baselines.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alternative-spatial-glm-baselines
          path: results/alternative_spatial_validation/glm_baselines/
