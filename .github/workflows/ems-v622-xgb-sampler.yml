name: EMS v6.22 XGBoost candidate sampler contract
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/xgb_candidate_sampler.py'
      - 'experiments/v622/test_xgb_candidate_sampler.py'
      - 'experiments/v622/xgb_selection_objective.py'
      - 'experiments/v622/test_xgb_selection_objective.py'
      - 'experiments/v622/xgb_inner_runner.py'
      - 'experiments/v622/test_xgb_inner_runner.py'
      - 'experiments/v622/xgb_backend.py'
      - 'experiments/v622/test_xgb_backend.py'
      - '.github/workflows/ems-v622-xgb-sampler.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas scikit-learn xgboost
      - run: python -m unittest experiments.v622.test_xgb_candidate_sampler experiments.v622.test_xgb_selection_objective experiments.v622.test_xgb_inner_runner experiments.v622.test_xgb_backend -v
      - name: Record deterministic candidate fingerprint
        run: python -m experiments.v622.xgb_candidate_sampler | tail -n 1
