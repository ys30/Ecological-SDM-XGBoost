name: C1 v6.22 research branch manual launcher
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v622-c1-manual-launcher.yml']
permissions:
  contents: read
jobs:
  research-c1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout research branch (not main)
        uses: actions/checkout@v4
        with:
          ref: research/v6.22-nested-spatial-tuning
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify checked-out research revision and required files
        shell: bash
        run: |
          echo "Research revision: $(git rev-parse HEAD)"
          git branch --show-current
          test -s data/train.csv
          test -s results/spatial_2d_block_assignments.csv
          test -s scripts/95_v622_c1_input_preflight.py
          test -s scripts/97_v622_c1_equal_taxon_global_pilot.py
          test -s scripts/98_v622_c1_inner_spatial_preflight.py
          test -s tests/test_v622_equal_taxon_selection.py
      - name: Compile C1 Python sources without dependencies
        run: python -m py_compile scripts/95_v622_c1_input_preflight.py scripts/97_v622_c1_equal_taxon_global_pilot.py scripts/98_v622_c1_inner_spatial_preflight.py tests/test_v622_equal_taxon_selection.py
      - name: Preflight canonical inputs without dependencies
        run: python scripts/95_v622_c1_input_preflight.py
      - name: Install C1 dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scikit-learn>=1.5,<2' 'xgboost>=2.1,<4'
      - name: Gate inner spatial rare-class feasibility before 960 fits
        run: python scripts/98_v622_c1_inner_spatial_preflight.py
      - name: Validate actual C1 selector and candidate grid
        run: python -m unittest discover -s tests -p 'test_v622_equal_taxon_selection.py' -v
      - name: Smoke-test installed XGBoost runtime
        shell: bash
        run: |
          python - <<'PY'
          import numpy as np
          import xgboost
          from xgboost import XGBClassifier
          X=np.array([[0,0],[0,1],[1,0],[1,1],[2,0],[2,1],[3,0],[3,1]],dtype=float)
          y=np.array([0,0,0,1,0,1,1,1],dtype=int)
          m=XGBClassifier(n_estimators=5,max_depth=2,n_jobs=1,
                          tree_method='hist',objective='binary:logistic',
                          eval_metric='logloss',random_state=622)
          m.fit(X,y)
          p=m.predict_proba(X)[:,1]
          assert p.shape==(8,) and np.isfinite(p).all()
          assert ((p>=0)&(p<=1)).all()
          print('XGBOOST_RUNTIME_SMOKE_PASS',xgboost.__version__)
          PY
      - name: Train C1 single-fold global pilot
        if: github.event_name == 'workflow_dispatch'
        run: python -u scripts/97_v622_c1_equal_taxon_global_pilot.py
      - name: Report C1 stage diagnostics
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          lines=['## C1 workflow diagnostics']
          files=[
              Path('results/v622_c1_preflight/input_gate.json'),
              Path('results/v622_c1_preflight/inner_spatial_gate.json'),
              Path('results/v622_c1_global_pilot/c1_outer_fold_diagnostics.csv'),
              Path('results/v622_c1_global_pilot/c1_inner_fold_diagnostics.csv'),
              Path('results/v622_c1_global_pilot/c1_progress.json'),
              Path('results/v622_c1_global_pilot/c1_manifest.json'),
          ]
          for p in files:
              lines.append('### '+str(p))
              if not p.exists():
                  lines.append('Not generated')
                  continue
              try:
                  if p.suffix=='.json':
                      data=json.loads(p.read_text())
                      lines.append('Status: '+str(data.get('status','unknown')))
                      if 'completed_taxa_count' in data:
                          lines.append('Completed taxa: '+str(data['completed_taxa_count']))
                  else:
                      with p.open(newline='') as f:
                          rows=list(csv.DictReader(f))
                      bad=[r for r in rows if str(r.get('status','')).startswith('FAIL')]
                      lines.append(f'Rows: {len(rows)}; failures: {len(bad)}')
                      for row in bad[:8]:
                          lines.append('- '+str(row))
              except Exception as exc:
                  lines.append('Diagnostic read error: '+str(exc))
          report='\n\n'.join(lines)+'\n'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(report)
          PY
      - name: Upload diagnostics even when training fails
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: c1-v622-manual-launcher-diagnostics
          path: |
            results/v622_c1_preflight/
            results/v622_c1_global_pilot/
          if-no-files-found: warn
