name: EMS v6.22 inner taxon dispatch
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/inner_taxon_dispatch.py'
      - 'experiments/v622/test_inner_taxon_dispatch.py'
      - '.github/workflows/ems-v622-inner-dispatch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - run: python -m unittest discover -s experiments/v622 -p 'test_inner_taxon_dispatch.py' -v
