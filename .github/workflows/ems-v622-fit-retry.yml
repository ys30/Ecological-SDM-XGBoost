name: EMS v6.22 fit retry policy
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/fit_retry_policy.py'
      - 'experiments/v622/test_fit_retry_policy.py'
      - '.github/workflows/ems-v622-fit-retry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - run: python -m unittest discover -s experiments/v622 -p 'test_fit_retry_policy.py' -v
