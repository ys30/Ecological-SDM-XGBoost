name: EMS v6.14 common-input XGBoost
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ems-v614-common-input.yml'
      - 'scripts/42_common_input_xgboost.R'
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript -e 'install.packages(c("xgboost","pROC"),repos="https://cloud.r-project.org")'
      - name: Run spatial out-of-fold experiment
        run: Rscript scripts/42_common_input_xgboost.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ems-v614-taxon-specific-xgboost
          path: results/v614_common_input/
          if-no-files-found: warn
