name: EMS v6.14 common-input XGBoost
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ems-v614-common-input.yml'
      - 'scripts/42_common_input_xgboost.R'
      - 'scripts/43_v614_common_input_audit.R'
      - 'scripts/44_v614_rare_taxon_retrieval.R'
      - 'scripts/45_v614_pooled_four_species_xgboost.R'
      - 'scripts/46_v614_pooling_ablation_audit.R'
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript -e 'install.packages(c("xgboost","pROC"),repos="https://cloud.r-project.org")'
      - name: Run spatial out-of-fold experiment
        run: Rscript scripts/42_common_input_xgboost.R
      - name: Run matched pooled common-input experiment
        run: Rscript scripts/45_v614_pooled_four_species_xgboost.R
      - name: Audit pooled versus specific ablation
        run: Rscript scripts/46_v614_pooling_ablation_audit.R
      - name: Audit paired results
        run: Rscript scripts/43_v614_common_input_audit.R
      - name: Rare-taxon top-k retrieval
        run: Rscript scripts/44_v614_rare_taxon_retrieval.R
      - name: Publish validation summary
        if: success()
        shell: bash
        run: |
          Rscript - <<'RSCRIPT'
          p <- read.csv("results/v614_common_input/taxon_specific_xgboost_oof.csv")
          m <- read.csv("results/v614_common_input/matched_comparison_audit.csv")
          rare <- read.csv("results/v614_common_input/rare_taxon_retrieval_summary.csv")
          pooling <- read.csv("results/v614_common_input/pooled_vs_specific_four_input.csv")
          stopifnot(nrow(p)==nrow(read.csv("data/train.csv")))
          valid <- is.finite(p$p)
          lines <- c(
            "## EMS v6.14 common-input XGBoost validation",
            "",
            paste0("- OOF observations: ", nrow(p)),
            paste0("- Valid predictions: ", sum(valid)),
            paste0("- Missing predictions: ", sum(!valid)),
            paste0("- Matched taxon-fold rows: ", nrow(m)),
            paste0("- Eligible specific-model AUC cells: ", sum(is.finite(m$specific_auc))),
            paste0("- Mean specific minus pooled XGBoost AUC: ", round(mean(m$delta_specific_minus_pooled_auc,na.rm=TRUE),4)),
            paste0("- Mean specific minus MaxEnt AUC: ", round(mean(m$delta_specific_minus_maxent_auc,na.rm=TRUE),4)),
            paste0("- Common-input pooled minus specific AUC: ", round(mean(pooling$delta_pooled_minus_specific_auc,na.rm=TRUE),4)),
            paste0("- Common-input pooled minus specific AP: ", round(mean(pooling$delta_pooled_minus_specific_ap,na.rm=TRUE),4)),
            paste0("- Rare-taxon top-k summaries: ", nrow(rare)),
            paste0("- Complete rare-taxon summaries: ", sum(rare$status=="ok")),
            "",
            "Full OOF predictions, metrics, calibration baselines and rare-taxon retrieval are in the artifact."
          )
          cat(paste(lines,collapse="\n"),"\n")
          writeLines(lines,Sys.getenv("GITHUB_STEP_SUMMARY"))
          RSCRIPT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ems-v614-taxon-specific-xgboost
          path: results/v614_common_input/
          if-no-files-found: error
