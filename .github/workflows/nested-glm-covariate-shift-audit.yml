name: Nested GLM covariate shift audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nested-glm-covariate-shift-audit.yml'
      - 'scripts/85_nested_glm_covariate_shift_audit.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scipy scikit-learn tabulate
      - run: python scripts/64_alternative_spatial_partition.py
      - run: python scripts/85_nested_glm_covariate_shift_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: nested-glm-covariate-shift-audit
          path: results/alternative_spatial_validation/covariate_shift_audit/
