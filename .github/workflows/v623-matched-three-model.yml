name: v6.23 matched three-model comparison
on:
  workflow_dispatch:
  push:
    branches:
      - research/v6.22-nested-spatial-tuning
    paths:
      - 'scripts/109_v623_matched_three_model_comparison.py'
      - 'scripts/110_v623_manuscript_figures.py'
      - 'scripts/111_v623_rare_taxon_sensitivity.py'
      - 'scripts/112_v623_leave_one_taxon_out.py'
      - 'scripts/113_v623_matched_calibration.py'
      - 'scripts/114_v623_fold_level_sensitivity.py'
      - 'scripts/115_v623_reliability_figures.py'
      - 'scripts/116_v623_training_exclusion_audit.py'
      - 'scripts/117_v623_exact_training_id_audit.py'
      - 'scripts/118_v623_feature_provenance_audit.py'
      - 'scripts/119_v623_frozen_spatial_fold_audit.py'
      - 'scripts/121_v623_manuscript_consistency_gate.py'
      - 'scripts/122_v623_figure_technical_qc.py'
      - '.github/workflows/v623-matched-three-model.yml'
permissions:
  contents: read
jobs:
  matched-three-model:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scikit-learn>=1.4,<2' 'xgboost>=2,<4' 'matplotlib>=3.8,<4'
      - name: Compile-check model and audit scripts
        run: python -m py_compile scripts/102_v623_fixed_xgb_outer_oof.py scripts/108_v623_matched_buffer_glm.py scripts/117_v623_exact_training_id_audit.py scripts/118_v623_feature_provenance_audit.py scripts/119_v623_frozen_spatial_fold_audit.py
      - name: Refit fixed 10-km buffered XGBoost
        run: python scripts/102_v623_fixed_xgb_outer_oof.py
      - name: Check XGBoost OOF integrity
        run: python scripts/103_v623_oof_integrity_gate.py
      - name: Refit matched linear and quadratic GLMs
        run: python scripts/108_v623_matched_buffer_glm.py
      - name: Verify row-level alignment and compare three models
        run: python scripts/109_v623_matched_three_model_comparison.py
      - name: Analyze lower-prevalence taxa separately
        run: python scripts/111_v623_rare_taxon_sensitivity.py
      - name: Audit leave-one-taxon-out influence
        run: python scripts/112_v623_leave_one_taxon_out.py
      - name: Audit matched model calibration
        run: python scripts/113_v623_matched_calibration.py
      - name: Audit spatial outer-fold influence
        run: python scripts/114_v623_fold_level_sensitivity.py
      - name: Generate OOF reliability figures
        run: python scripts/115_v623_reliability_figures.py
      - name: Audit matched training exclusions
        run: python scripts/116_v623_training_exclusion_audit.py
      - name: Reconstruct exact buffered training IDs
        run: python scripts/117_v623_exact_training_id_audit.py
      - name: Audit fold-local predictor transformations
        run: python scripts/118_v623_feature_provenance_audit.py
      - name: Audit frozen spatial fold mapping integrity
        run: python scripts/119_v623_frozen_spatial_fold_audit.py
      - name: Generate manuscript figures
        run: python scripts/110_v623_manuscript_figures.py
      - name: Verify manuscript headline numbers and figure artifacts
        run: python scripts/121_v623_manuscript_consistency_gate.py
      - name: Check publication figure technical quality
        run: python scripts/122_v623_figure_technical_qc.py
      - name: Upload full comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v623-matched-three-model-comparison
          path: |
            results/v623_matched_three_model/
            results/v623_matched_glm_10km/
          if-no-files-found: warn
