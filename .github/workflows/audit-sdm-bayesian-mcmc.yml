name: Audit Bayesian MCMC diagnostics
on:
  push:
    paths:
      - 'scripts/18_audit_bayesian_mcmc.py'
      - '.github/workflows/audit-sdm-bayesian-mcmc.yml'
      - 'results/bayes_spatial_fold_*_diagnostics.csv'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Summarize five-fold MCMC diagnostics
        run: python scripts/18_audit_bayesian_mcmc.py
      - name: Upload diagnostics as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: bayesian-mcmc-diagnostics
          path: |
            results/bayes_mcmc_diagnostics_all.csv
            results/bayes_mcmc_diagnostics_summary.csv
          if-no-files-found: error
          retention-days: 30
