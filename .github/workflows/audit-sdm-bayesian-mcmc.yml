name: Audit Bayesian MCMC diagnostics
on:
  push:
    paths:
      - 'scripts/18_audit_bayesian_mcmc.py'
      - '.github/workflows/audit-sdm-bayesian-mcmc.yml'
      - 'results/bayes_spatial_fold_*_diagnostics.csv'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Summarize five-fold MCMC diagnostics
        run: python scripts/18_audit_bayesian_mcmc.py
      - name: Publish diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/bayes_mcmc_diagnostics_all.csv results/bayes_mcmc_diagnostics_summary.csv
          git diff --cached --quiet || (git commit -m "Publish Bayesian MCMC diagnostics audit" && git push)
