name: v6.24 nested C1 and spatial uncertainty
on:
  push:
    branches: [research/v6.22-nested-spatial-tuning]
    paths:
      - '.github/workflows/v624-c1.yml'
      - 'scripts/126_v624_nested_c1.py'
      - 'scripts/127_v624_c1_analysis.py'
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 xgboost-cpu==3.1.3
      - run: python scripts/126_v624_nested_c1.py --outer 1 --pilot
      - uses: actions/upload-artifact@v4
        with:
          name: v624-c1-inner-only-pilot
          path: results/v624_c1/pilot/
          if-no-files-found: error
  fit:
    runs-on: ubuntu-latest
    needs: pilot
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [17, 42, 101, 202, 622, 2026]
        outer: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 xgboost-cpu==3.1.3
      - run: python scripts/126_v624_nested_c1.py --outer ${{ matrix.outer }} --seed ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: v624-c1-${{ matrix.seed }}-${{ matrix.outer }}
          path: results/v624_c1/
          if-no-files-found: error
  validate:
    runs-on: ubuntu-latest
    needs: fit
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 xgboost-cpu==3.1.3
      - uses: actions/download-artifact@v4
        with:
          pattern: v624-c1-[0-9]*
          path: results/v624_c1/
          merge-multiple: true
      - run: python scripts/127_v624_c1_analysis.py
      - uses: actions/upload-artifact@v4
        with:
          name: v624-c1-verified-analysis
          path: results/v624_c1_analysis/
          if-no-files-found: error
