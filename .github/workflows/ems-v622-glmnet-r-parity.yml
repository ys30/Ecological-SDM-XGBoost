name: EMS v6.22 R glmnet sklearn diagnostic
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/check_glmnet_r_parity.py'
      - 'experiments/v622/elasticnet_prototype.py'
      - '.github/workflows/ems-v622-glmnet-r-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: glmnet
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scipy scikit-learn
      - run: python -m experiments.v622.check_glmnet_r_parity
