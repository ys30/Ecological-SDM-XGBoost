name: Audit buffered Bayesian vs GLM matched OOF
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-buffered-bayesian-vs-glm.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn scipy
      - uses: dawidd6/action-download-artifact@v6
        with:
          workflow: buffered-alternative-spatial-glm.yml
          run_id: 41874313829
          name: buffered-alternative-spatial-glm
          path: results
      - uses: dawidd6/action-download-artifact@v6
        with:
          workflow: buffered-bayesian-alternative-spatial.yml
          run_id: 41907588922
          name: buffered-bayes-*
          name_is_regexp: false
          path: results
          merge_multiple: true
      - name: Normalize downloaded Bayesian artifact folders
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path("results")
          files=list(root.rglob("*_oof.csv"))
          print("OOF files:",len(files))
          for f in files:
              if "bayes_buffered" not in f.parts: continue
              i=f.parts.index("bayes_buffered")
              target=root.joinpath(*f.parts[i:])
              if f!=target:
                  target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(f,target)
          PY
      - name: Check artifact paths
        run: find results -maxdepth 5 -type f | grep -E 'buffered_glm_oof|bayes_buffered' | head -40
      - name: Audit matched predictions
        run: python scripts/73_audit_buffered_bayesian_vs_glm.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audited-buffered-model-comparison
          path: results/alternative_spatial_validation/buffered_four_model/
