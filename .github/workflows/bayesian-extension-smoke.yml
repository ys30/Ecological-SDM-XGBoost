name: Bayesian extension quadratic and no-pooling fold smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/57_bayes_extension_spatial_cv.R'
      - '.github/workflows/bayesian-extension-smoke.yml'
permissions:
  contents: read
jobs:
  extension:
    strategy:
      fail-fast: false
      matrix:
        variant: [quadratic, no_pool]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::BH
            any::RcppEigen
            any::rstan
            any::brms
            any::posterior
            any::pROC
      - name: Parse R script before fitting
        run: Rscript -e 'parse(file="scripts/57_bayes_extension_spatial_cv.R"); cat("R syntax OK\\n")'
      - name: Fit held-out fold 1
        run: Rscript scripts/57_bayes_extension_spatial_cv.R ${{ matrix.variant }} 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bayes-extension-${{ matrix.variant }}-fold1
          path: results/bayes_extensions/
