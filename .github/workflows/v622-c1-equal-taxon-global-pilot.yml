name: v6.22 C1 equal-taxon global tuning pilot
on:
  workflow_dispatch:
  push:
    branches:
      - research/v6.22-nested-spatial-tuning
    paths:
      - '.github/workflows/v622-c1-equal-taxon-global-pilot.yml'
      - 'scripts/95_v622_c1_input_preflight.py'
      - 'scripts/97_v622_c1_equal_taxon_global_pilot.py'
      - 'scripts/98_v622_c1_inner_spatial_preflight.py'
      - 'tests/test_v622_equal_taxon_selection.py'
permissions:
  contents: read
jobs:
  c1-global-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile C1 scripts
        run: python -m py_compile scripts/95_v622_c1_input_preflight.py scripts/97_v622_c1_equal_taxon_global_pilot.py scripts/98_v622_c1_inner_spatial_preflight.py
      - name: Validate canonical inputs
        run: python scripts/95_v622_c1_input_preflight.py
      - name: Install spatial diagnostic dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scikit-learn>=1.5,<2'
      - name: Gate inner spatial rare-class feasibility
        id: inner_gate
        continue-on-error: ${{ github.event_name == 'push' }}
        run: python scripts/98_v622_c1_inner_spatial_preflight.py
      - name: Install XGBoost for selection tests
        run: python -m pip install 'xgboost>=2.1,<4'
      - name: Test equal-taxon selection invariants
        run: python -m unittest discover -s tests -p 'test_v622_equal_taxon_selection.py' -v
      - name: Run global equal-taxon tuning pilot
        if: github.event_name == 'workflow_dispatch' && steps.inner_gate.outcome == 'success'
        run: python scripts/97_v622_c1_equal_taxon_global_pilot.py
      - name: Publish C1 diagnostic summary even after failure
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          lines=['## C1 equal-taxon pilot diagnostic summary']
          for file in [
              'results/v622_c1_preflight/input_gate.json',
              'results/v622_c1_preflight/inner_spatial_gate.json',
              'results/v622_c1_global_pilot/c1_outer_fold_diagnostics.csv',
              'results/v622_c1_global_pilot/c1_inner_fold_diagnostics.csv',
              'results/v622_c1_global_pilot/c1_candidate_summary.csv',
              'results/v622_c1_global_pilot/c1_manifest.json']:
              p=Path(file)
              lines.append(f'### {file}')
              if not p.exists():
                  lines.append('Not produced (check earlier job step).')
                  continue
              if p.suffix=='.json':
                  try:
                      d=json.loads(p.read_text())
                      lines.append('Status: '+str(d.get('status','not specified')))
                      lines.append('Rows: '+str(d.get('data_rows',d.get('outer_oof_rows','unknown'))))
                  except Exception as e:
                      lines.append('JSON read failed: '+str(e))
              else:
                  with p.open(newline='') as f:
                      rows=list(csv.DictReader(f))
                  lines.append(f'Rows: {len(rows)}')
                  failures=[x for x in rows if str(x.get('status','')).startswith('FAIL')]
                  lines.append(f'FAIL rows: {len(failures)}')
                  for row in failures[:12]:
                      lines.append('- '+str(row))
          summary='\n\n'.join(lines)+'\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(summary)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v622-c1-equal-taxon-global-pilot
          path: |
            results/v622_c1_preflight/
            results/v622_c1_global_pilot/
          if-no-files-found: warn
