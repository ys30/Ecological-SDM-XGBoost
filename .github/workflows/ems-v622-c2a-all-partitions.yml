name: EMS v6.22 C2a all-partition preflight
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - '.github/workflows/ems-v622-c2a-all-partitions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scikit-learn tabulate
      - run: python scripts/64_alternative_spatial_partition.py
      - name: Diagnose km15 partition reproducibility
        run: |
          python - <<'PY'
          import hashlib
          import pandas as pd
          from pathlib import Path
          p=Path("results/alternative_spatial_validation/kmeans15_five_fold_assignments.csv")
          d=pd.read_csv(p)
          print("KM15_SHA256_ACTUAL",hashlib.sha256(p.read_bytes()).hexdigest(),flush=True)
          print("KM15_SHA256_EXPECTED","04686634473d51b5c63dcbd4474659fe864a114ae0885c5f55736522c798ce",flush=True)
          print("KM15_SHAPE",d.shape,"KM15_COLUMNS",list(d.columns),flush=True)
          print("KM15_FOLD_COUNTS",d.groupby("fold").size().to_dict(),flush=True)
          print("KM15_CLUSTER_COUNTS",d.groupby("fold")["cluster"].nunique().to_dict(),flush=True)
          print("KM15_DUPLICATE_PLOTS",int(d["plot"].duplicated().sum()),flush=True)
          PY
      - run: python -m experiments.v622.audit_c2a_all_partitions
      - uses: actions/upload-artifact@v4
        with:
          name: ems-v622-c2a-all-partitions-${{ github.run_id }}
          path: results/v622/c2a_partition_preflight.csv
          if-no-files-found: error
