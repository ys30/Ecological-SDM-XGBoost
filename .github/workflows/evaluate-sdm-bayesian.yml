name: Bayesian hierarchical SDM spatial smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/15_bayes_hierarchical_spatial.R'
      - '.github/workflows/evaluate-sdm-bayesian.yml'
permissions:
  contents: read
jobs:
  bayes-fold-one:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::BH
            any::RcppEigen
            any::rstan
            any::brms
            any::posterior
            any::pROC
      - name: Verify Stan compilation dependencies
        run: |
          Rscript -e 'stopifnot(requireNamespace("BH",quietly=TRUE),requireNamespace("rstan",quietly=TRUE),requireNamespace("brms",quietly=TRUE)); cat("BH:",as.character(packageVersion("BH")),"\\n"); cat("BH include:",system.file("include",package="BH"),"\\n"); stopifnot(nzchar(system.file("include",package="BH")))'
      - name: Run one held-out spatial fold
        run: Rscript scripts/15_bayes_hierarchical_spatial.R 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bayesian-spatial-fold-one
          path: |
            results/bayes_spatial_cv_*.csv
            results/bayes_spatial_fold_1_diagnostics.csv
