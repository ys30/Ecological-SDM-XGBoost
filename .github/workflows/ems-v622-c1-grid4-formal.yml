name: EMS v6.22 frozen C1 grid4 OOF
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - '.github/workflows/ems-v622-c1-grid4-formal.yml'
      - 'experiments/v622/docs/FROZEN_C1.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nested-c1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas scikit-learn xgboost
      - name: Run frozen nested C1 species and pooled grid4
        run: python -m experiments.v622.run_c1_outer_grid
      - name: Archive immutable formal OOF and tuning logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ems-v622-c1-grid4-oof-${{ github.run_id }}
          path: results/v622/
          if-no-files-found: warn
          retention-days: 90
