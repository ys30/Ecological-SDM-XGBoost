name: EMS v6.22 frozen C1 grid4 OOF
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - '.github/workflows/ems-v622-c1-grid4-formal.yml'
      - 'experiments/v622/docs/FROZEN_C1.json'
      - 'experiments/v622/docs/FROZEN_C1_KM15.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nested-c1:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas scikit-learn xgboost
      - name: Run frozen nested C1 species and pooled grid4
        run: python -m experiments.v622.run_c1_outer_grid
      - name: Archive immutable formal OOF and tuning logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ems-v622-c1-grid4-oof-${{ github.run_id }}
          path: results/v622/
          if-no-files-found: warn
          retention-days: 90

  nested-c1-km15:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas scikit-learn xgboost
      - name: Download SHA-matched original km15 assignments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42959606626 -R ys30/Ecological-SDM-XGBoost -n ems-v622-km15-recovery-42959606626 -D results/alternative_spatial_validation
          echo '04686634473d51b5c63dcbd4474659fe864a114ae0885c5c5f55736522c798ce  results/alternative_spatial_validation/kmeans15_five_fold_assignments.csv' | sha256sum -c -
      - name: Run frozen nested C1 km15
        run: python -m experiments.v622.run_c1_outer_km15
      - name: Archive immutable km15 OOF and tuning logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ems-v622-c1-km15-oof-${{ github.run_id }}
          path: results/v622/
          if-no-files-found: warn
          retention-days: 90
