name: EMS v6.22 C2a real inner tuning smoke
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - '.github/workflows/ems-v622-c2a-inner-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inner-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scipy scikit-learn
      - name: C2a real training-only spatial inner-fold engineering smoke
        run: python -m experiments.v622.run_c2a_inner_pilot --outer-fold 1 --taxon nsw18
      - uses: actions/upload-artifact@v4
        with:
          name: ems-v622-c2a-inner-smoke-${{ github.run_id }}
          path: results/v622/c2a_real_inner_pilot.csv
          if-no-files-found: error
