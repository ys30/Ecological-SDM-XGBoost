name: Collect Bayesian spatial CV artifacts
on:
  workflow_run:
    workflows: ['Bayesian hierarchical SDM remaining spatial folds']
    types: [completed]
  workflow_dispatch:
    inputs:
      fold_one_run_id:
        description: 'Successful fold 1 workflow run ID'
        required: true
        type: string
      remaining_run_id:
        description: 'Successful folds 2-5 matrix workflow run ID'
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts from completed runs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ONE: ${{ inputs.fold_one_run_id }}
          RUN_REMAINING: ${{ inputs.remaining_run_id }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p downloaded
          if [ -z "$RUN_REMAINING" ]; then RUN_REMAINING="$TRIGGER_RUN"; fi
          if [ -z "$RUN_ONE" ]; then
            RUN_ONE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow evaluate-sdm-bayesian.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$RUN_ONE" && test -n "$RUN_REMAINING"
          gh run download "$RUN_ONE" --repo "$GITHUB_REPOSITORY" --pattern 'bayesian-spatial-fold-one' --dir downloaded
          gh run download "$RUN_REMAINING" --repo "$GITHUB_REPOSITORY" --pattern 'bayesian-spatial-fold-*' --dir downloaded
          find downloaded -mindepth 2 -type f -name '*.csv' -exec cp {} downloaded/ \;
      - name: Check required fold outputs
        run: |
          for k in 1 2 3 4 5; do
            test -f "downloaded/bayes_spatial_cv_metrics_folds_${k}.csv"
            test -f "downloaded/bayes_spatial_cv_predictions_folds_${k}.csv"
            test -f "downloaded/bayes_spatial_fold_${k}_diagnostics.csv"
          done
      - name: Combine fold CSVs
        run: |
          python - <<'PY'
          import csv,glob,os
          os.makedirs("results",exist_ok=True)
          for kind in ("metrics","predictions"):
              files=[f"downloaded/bayes_spatial_cv_{kind}_folds_{k}.csv" for k in range(1,6)]
              rows=[]
              for f in files:
                  with open(f,newline="") as handle:
                      rows.extend(csv.DictReader(handle))
              with open(f"results/bayes_spatial_cv_{kind}.csv","w",newline="") as out:
                  writer=csv.DictWriter(out,fieldnames=rows[0].keys())
                  writer.writeheader();writer.writerows(rows)
          PY
      - name: Publish aggregated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp downloaded/bayes_spatial_fold_*_diagnostics.csv results/
          git add results/bayes_spatial_cv_metrics.csv results/bayes_spatial_cv_predictions.csv results/bayes_spatial_fold_*_diagnostics.csv
          git diff --cached --quiet || (git commit -m "Publish Bayesian five-fold spatial CV results" && git push)
