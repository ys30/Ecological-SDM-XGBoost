name: EMS v6.22 class support policy tests
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/class_support_policy.py'
      - 'experiments/v622/test_class_support_policy.py'
      - '.github/workflows/ems-v622-class-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python -m unittest discover -s experiments/v622 -p 'test_class_support_policy.py' -v
