name: EMS v6.22 glmnet penalty convention audit
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/test_glmnet_penalty_convention.py'
      - '.github/workflows/ems-v622-glmnet-penalty-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - run: python -m unittest experiments.v622.test_glmnet_penalty_convention -v
