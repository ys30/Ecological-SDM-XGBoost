name: Compare Bayesian and XGBoost rare-taxon retrieval
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/54_compare_rare_taxon_retrieval.py'
      - '.github/workflows/compare-rare-taxon-bayes-xgboost.yml'
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match fold-local top-k retrieval and generate figure
        run: python3 scripts/54_compare_rare_taxon_retrieval.py
      - name: Publish verified CSV and SVG
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/rare_taxon_bayesian_xgboost_matched_topk.csv results/figures/27_rare_taxon_matched_topk_bayesian_xgboost.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Publish matched rare-taxon Bayesian XGBoost top-k comparison'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rare-taxon-bayesian-xgboost-matched-topk
          path: |
            results/rare_taxon_bayesian_xgboost_matched_topk.csv
            results/figures/27_rare_taxon_matched_topk_bayesian_xgboost.svg
          if-no-files-found: warn
