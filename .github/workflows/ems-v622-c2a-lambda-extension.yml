name: EMS v6.22 C2a lambda lower-bound sensitivity
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - '.github/workflows/ems-v622-c2a-lambda-extension.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: glmnet
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scikit-learn
      - run: python -m experiments.v622.prepare_c2a_r_native
      - run: Rscript experiments/v622/audit_c2a_lambda_extension.R
      - uses: actions/upload-artifact@v4
        with:
          name: ems-v622-c2a-lambda-extension-${{ github.run_id }}
          path: |
            results/v622/c2a_r_native/quad_rt_boundary_extension_trace.csv
            results/v622/c2a_r_native/quad_rt_boundary_extension_summary.csv
          if-no-files-found: error
