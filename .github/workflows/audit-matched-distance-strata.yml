name: Audit matched OOF performance by train-distance
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/50_matched_distance_stratified_oof.py'
      - '.github/workflows/audit-matched-distance-strata.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute distance-stratified held-out metrics
        run: python3 scripts/50_matched_distance_stratified_oof.py
      - name: Publish distance-stratified metrics
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/matched_distance_stratified_oof_metrics.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified matched distance-stratified OOF metrics'
            git pull --rebase origin main
            git push
          fi
      - name: Upload audit CSV
        uses: actions/upload-artifact@v4
        with:
          name: matched-distance-stratified-oof
          path: results/matched_distance_stratified_oof_metrics.csv
          if-no-files-found: error
