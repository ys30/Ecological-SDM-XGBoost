name: EMS v6.22 frozen C1 km15 OOF
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - '.github/workflows/ems-v622-c1-km15-formal.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  nested-c1-km15:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas scikit-learn xgboost
      - name: Recover exact pinned original km15 folds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42959606626 -R ys30/Ecological-SDM-XGBoost -n ems-v622-km15-recovery-42959606626 -D results/alternative_spatial_validation
          sha256sum results/alternative_spatial_validation/kmeans15_five_fold_assignments.csv
      - name: Run frozen km15 nested C1 OOF
        run: python -m experiments.v622.run_c1_outer_km15
      - name: Archive OOF and tuning logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ems-v622-c1-km15-oof-${{ github.run_id }}
          path: results/v622/
          if-no-files-found: warn
          retention-days: 90
