name: Bayesian extension spatial residual diagnostics
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/62_bayes_spatial_residual_moran.py'
      - '.github/workflows/bayesian-spatial-residual.yml'
permissions:
  actions: read
  contents: read
jobs:
  spatial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scipy tabulate
      - uses: actions/download-artifact@v4
        with:
          run-id: 41769286020
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: bayes-*
          path: downloaded
      - run: python scripts/62_bayes_spatial_residual_moran.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bayesian-spatial-residual-moran
          path: results/bayes_extensions/
