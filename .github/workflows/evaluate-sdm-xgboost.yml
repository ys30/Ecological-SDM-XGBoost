name: Evaluate SDM plot-held-out XGBoost
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/06_evaluate_plot_holdout.R"
      - ".github/workflows/evaluate-sdm-xgboost.yml"
      - "data/train.csv"
permissions:
  contents: write
concurrency:
  group: sdm-evaluation-publication
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::xgboost
            any::ggplot2
            any::pROC
      - name: Evaluate plot-held-out model
        run: Rscript scripts/06_evaluate_plot_holdout.R
      - name: Publish metrics and figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/sdm-eval
          cp results/plot_holdout_*.csv /tmp/sdm-eval/
          cp results/figures/0{6,7,8}_*.png /tmp/sdm-eval/
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p results/figures
            cp /tmp/sdm-eval/*.csv results/
            cp /tmp/sdm-eval/*.png results/figures/
            git add results/plot_holdout_*.csv results/figures/0{6,7,8}_*.png
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish plot-held-out SDM evaluation"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
