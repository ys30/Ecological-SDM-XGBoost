name: Audit projected coordinate distance scale
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-coordinate-distance-scale.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scipy
      - run: python scripts/75_coordinate_scale_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coordinate-distance-scale-audit
          path: results/alternative_spatial_validation/coordinate_scale_audit/
