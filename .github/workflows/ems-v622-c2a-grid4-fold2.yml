name: EMS v6.22 C2a grid4 fold2 diagnostic
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - '.github/workflows/ems-v622-c2a-grid4-fold2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fold2:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scikit-learn tabulate
      - run: python scripts/64_alternative_spatial_partition.py
      - run: python -m experiments.v622.audit_c2a_all_partitions
      - run: python -m experiments.v622.prepare_c2a_batch --design grid4_s2026_b0 --fold 2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: glmnet
          cache: true
      - name: Fit all eight taxa on independent outer fold 2
        run: |
          set -euo pipefail
          for dir in results/v622/c2a_batch_DIAGNOSTIC_ONLY/grid4_s2026_b0/fold2/*; do
            export C2A_BASE="$dir"
            export C2A_TAXON="$(basename "$dir")"
            export C2A_OUTER_FOLD=2
            Rscript experiments/v622/run_c2a_train_only_path_smoke.R
          done
      - name: Audit paired OOF coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root=Path("results/v622/c2a_batch_DIAGNOSTIC_ONLY/grid4_s2026_b0/fold2")
          paths=sorted(root.glob("*/outer_train_only_path_DIAGNOSTIC_ONLY.csv"))
          assert len(paths)==8, f"expected eight taxa, got {len(paths)}"
          n=0
          for path in paths:
              d=pd.read_csv(path)
              assert d.duplicated(["plot","model_id"]).sum()==0,path
              assert d.groupby("plot").model_id.nunique().eq(2).all(),path
              assert d.groupby("model_id").size().nunique()==1,path
              assert d.diagnostic_only.astype(str).str.lower().eq("true").all(),path
              assert d.pred.between(0,1).all(),path
              assert d.outer_fold.eq(2).all(),path
              n+=len(d)
          print("PASS grid4 fold2 eight-taxon paired diagnostic OOF",n,"rows",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: c2a-grid4-fold2-diagnostic-${{ github.run_id }}
          path: |
            results/v622/c2a_batch_DIAGNOSTIC_ONLY/grid4_s2026_b0/fold2/*/outer_train_only_path_DIAGNOSTIC_ONLY.csv
            results/v622/c2a_batch_DIAGNOSTIC_ONLY/grid4_s2026_b0/fold2/*/*train_only_path_trace.csv
          if-no-files-found: error
