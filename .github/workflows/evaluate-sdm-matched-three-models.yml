name: Matched Bayesian MaxEnt XGBoost benchmark
on:
  push:
    paths:
      - 'scripts/16_matched_bayesian_maxent_xgboost.R'
      - '.github/workflows/evaluate-sdm-matched-three-models.yml'
      - 'results/bayes_spatial_cv_predictions.csv'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::pROC
      - name: Run exact-record benchmark
        run: Rscript scripts/16_matched_bayesian_maxent_xgboost.R
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/matched_bayesian_maxent_xgboost_folds.csv results/matched_bayesian_maxent_xgboost_species.csv
          git diff --cached --quiet || (git commit -m "Publish matched three-model spatial benchmark" && git push)
