name: EMS v6.22 C2a native R glmnet path audit
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - '.github/workflows/ems-v622-c2a-r-path-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: glmnet
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scikit-learn
      - name: Prepare real outer-training only partitions
        run: python -m experiments.v622.prepare_c2a_r_native
      - name: Audit native glmnet automatic 30-value lambda paths
        run: Rscript experiments/v622/audit_c2a_native_glmnet.R
      - uses: actions/upload-artifact@v4
        with:
          name: ems-v622-c2a-r-path-audit-${{ github.run_id }}
          path: results/v622/c2a_r_native/native_glmnet_path_trace.csv
          if-no-files-found: error
