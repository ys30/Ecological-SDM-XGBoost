name: Audit Bayesian held-out prediction metrics
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/35_validate_bayesian_oof_against_matched.py'
      - 'results/bayes_spatial_cv_predictions.csv'
      - 'results/matched_bayesian_maxent_xgboost_folds.csv'
      - '.github/workflows/audit-bayesian-oof-metrics.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recompute original-fit Bayesian matched AUC and AP
        run: python3 scripts/35_validate_bayesian_oof_against_matched.py
