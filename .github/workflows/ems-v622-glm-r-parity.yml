name: EMS v6.22 R Python GLM parity
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/glm_adapter.py'
      - 'experiments/v622/check_glm_r_parity.py'
      - '.github/workflows/ems-v622-glm-r-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scipy statsmodels
      - run: python -m experiments.v622.check_glm_r_parity
