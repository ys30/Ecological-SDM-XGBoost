name: Plot three-model SDM benchmark (Python fallback)
on:
  push:
    paths:
      - 'scripts/20_plot_three_model_python.py'
      - '.github/workflows/plot-sdm-three-models-python.yml'
      - 'results/matched_three_model_plot_data.csv'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install matplotlib numpy
      - run: python scripts/20_plot_three_model_python.py
      - name: Publish generated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/figures/22_three_model_auc.png results/figures/22_three_model_ap.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish matched three-model benchmark PNG figures"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
