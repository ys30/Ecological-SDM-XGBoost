name: EMS v6.22 pooled support decision audit
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/audit_pooled_support.py'
      - '.github/workflows/ems-v622-pooled-support-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas scikit-learn
      - run: python -m experiments.v622.audit_pooled_support
