name: EMS v6.22 C1 grid4 descriptive OOF audit
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - '.github/workflows/ems-v622-c1-grid4-descriptive.yml'
      - 'experiments/v622/analyze_c1_grid4_oof.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas scikit-learn
      - name: Retrieve successful frozen OOF run artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42955194925 -R ys30/Ecological-SDM-XGBoost -n ems-v622-c1-grid4-oof-42955194925 -D results/v622
          test -s results/v622/oof_xgb_species_tuned_grid4_s2026_b0.csv.gz
          test -s results/v622/oof_xgb_pooled_tuned_grid4_s2026_b0.csv.gz
      - name: Compute descriptive matched OOF summary
        run: python -m experiments.v622.analyze_c1_grid4_oof
      - uses: actions/upload-artifact@v4
        with:
          name: ems-v622-c1-grid4-descriptive-${{ github.run_id }}
          path: |
            results/v622/c1_grid4_tuned_pooled_vs_species_descriptive.csv
            results/v622/c1_grid4_descriptive_summary.json
          if-no-files-found: error

  km15-audit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas scikit-learn
      - name: Retrieve verified km15 formal OOF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42960556320 -R ys30/Ecological-SDM-XGBoost -n ems-v622-c1-km15-oof-42960556320 -D results/v622
      - name: Analyze km15 paired AUC
        run: python -m experiments.v622.analyze_c1_km15_oof
      - uses: actions/upload-artifact@v4
        with:
          name: ems-v622-c1-km15-descriptive-${{ github.run_id }}
          path: |
            results/v622/c1_km15_tuned_pooled_vs_species_descriptive.csv
            results/v622/c1_km15_descriptive_summary.json
          if-no-files-found: error

  fixed-vs-tuned:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas scikit-learn
      - name: Download pinned tuned and fixed predictions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42955194925 -R ys30/Ecological-SDM-XGBoost -n ems-v622-c1-grid4-oof-42955194925 -D results/v622
          gh run download 42960556320 -R ys30/Ecological-SDM-XGBoost -n ems-v622-c1-km15-oof-42960556320 -D results/v622
          gh run download 42962847733 -R ys30/Ecological-SDM-XGBoost -n ems-v622-c1-fixed-controls-42962847733 -D results/v622
      - name: Compute C1a and C1b paired metrics
        run: python -m experiments.v622.analyze_c1_fixed_vs_tuned
      - uses: actions/upload-artifact@v4
        with:
          name: ems-v622-c1-fixed-vs-tuned-${{ github.run_id }}
          path: |
            results/v622/c1_fixed_vs_tuned_paired_cells.csv
            results/v622/c1_fixed_vs_tuned_summary.json
          if-no-files-found: error
