name: Plot matched three-model SDM results
on:
  push:
    paths:
      - 'scripts/17_plot_three_model_benchmark.R'
      - '.github/workflows/plot-sdm-three-models.yml'
      - 'results/matched_bayesian_maxent_xgboost_species.csv'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  plot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install R and ggplot2 from Ubuntu packages
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends r-base-core r-cran-ggplot2
      - name: Build species benchmark charts
        run: Rscript scripts/17_plot_three_model_benchmark.R
      - name: Publish charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/figures/22_three_model_auc.png results/figures/22_three_model_ap.png results/matched_three_model_plot_data.csv
          if ! git diff --cached --quiet; then
            git commit -m "Publish matched three-model SDM charts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
