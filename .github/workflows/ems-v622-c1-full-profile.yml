name: EMS v6.22 C1 full-candidate engineering profile
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/profile_full_c1_runtime.py'
      - '.github/workflows/ems-v622-c1-full-profile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas scikit-learn xgboost
      - name: Profile 30 candidates on real outer-training data
        run: python -m experiments.v622.profile_full_c1_runtime
