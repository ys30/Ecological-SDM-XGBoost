name: EMS v6.22 real-input XGBoost C1 smoke
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/smoke_real_xgb_c1.py'
      - '.github/workflows/ems-v622-real-xgb-c1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-c1-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas scikit-learn xgboost
      - name: Real input hash-verified inner CV smoke, no outer metrics
        run: python -m experiments.v622.smoke_real_xgb_c1
