name: EMS v6.22 GLM adapter engineering smoke
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/glm_adapter.py'
      - 'experiments/v622/test_glm_adapter.py'
      - '.github/workflows/ems-v622-glm-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  glm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scipy statsmodels
      - run: python -m unittest discover -s experiments/v622 -p 'test_glm_adapter.py' -v
