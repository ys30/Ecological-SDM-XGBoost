name: Audit Bayesian five-fold extension OOF
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/58_audit_bayes_extension_oof.py'
      - '.github/workflows/audit-bayesian-extension-oof.yml'
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy scikit-learn tabulate
      - uses: actions/download-artifact@v4
        with:
          run-id: 41769286020
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: bayes-*
          path: downloaded
          merge-multiple: false
      - name: Verify paired OOF and calculate metrics
        run: python scripts/58_audit_bayes_extension_oof.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bayes-five-fold-paired-summary
          path: results/bayes_extensions/
