name: EMS v6.22 contrast scientific semantics
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/check_contrast_semantics.py'
      - 'experiments/v622/config/v622_model_matrix.csv'
      - 'experiments/v622/config/v622_contrasts.csv'
      - '.github/workflows/ems-v622-contrast-semantics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m experiments.v622.check_contrast_semantics
