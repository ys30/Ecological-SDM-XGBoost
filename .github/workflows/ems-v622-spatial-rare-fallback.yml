name: EMS v6.22 spatial rare fallback
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/test_spatial_rare_fallback.py'
      - '.github/workflows/ems-v622-spatial-rare-fallback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scipy statsmodels scikit-learn
      - run: python -m unittest experiments.v622.test_spatial_rare_fallback -v
