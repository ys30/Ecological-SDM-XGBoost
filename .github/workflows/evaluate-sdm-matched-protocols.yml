name: SDM matched protocol comparison
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/08_matched_protocol_comparison.R"
      - ".github/workflows/evaluate-sdm-matched-protocols.yml"
      - "data/train.csv"
permissions:
  contents: write
concurrency:
  group: sdm-matched-protocol-publication
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::xgboost
            any::ggplot2
            any::pROC
      - name: Run matched protocol comparison
        run: Rscript scripts/08_matched_protocol_comparison.R
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdm-matched-protocols
          path: |
            results/matched_protocol_*.csv
            results/figures/11_*.png
          if-no-files-found: warn
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/sdm-matched
          cp results/matched_protocol_*.csv results/figures/11_*.png /tmp/sdm-matched/
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p results/figures
            cp /tmp/sdm-matched/*.csv results/
            cp /tmp/sdm-matched/*.png results/figures/
            git add results/matched_protocol_*.csv results/figures/11_*.png
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish matched-protocol SDM comparison"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
