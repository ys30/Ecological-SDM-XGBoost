name: EMS v6.22 feature contract tests
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/feature_contract.py'
      - 'experiments/v622/test_feature_contract.py'
      - '.github/workflows/ems-v622-feature-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feature-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - run: python -m unittest discover -s experiments/v622 -p 'test_feature_contract.py' -v
