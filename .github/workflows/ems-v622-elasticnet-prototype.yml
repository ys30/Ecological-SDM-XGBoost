name: EMS v6.22 elastic-net prototype smoke
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/elasticnet_prototype.py'
      - 'experiments/v622/test_elasticnet_prototype.py'
      - '.github/workflows/ems-v622-elasticnet-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy scikit-learn
      - run: python -m unittest experiments.v622.test_elasticnet_prototype -v
