name: EMS v6.22 C1 km15 descriptive OOF audit
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - '.github/workflows/ems-v622-c1-km15-descriptive.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas scikit-learn
      - name: Retrieve successful km15 OOF artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42960556320 -R ys30/Ecological-SDM-XGBoost -n ems-v622-c1-km15-oof-42960556320 -D results/v622
          test -s results/v622/oof_xgb_species_tuned_km15_b0.csv.gz
          test -s results/v622/oof_xgb_pooled_tuned_km15_b0.csv.gz
      - name: Compute matched km15 OOF summary
        run: python -m experiments.v622.analyze_c1_km15_oof
      - uses: actions/upload-artifact@v4
        with:
          name: ems-v622-c1-km15-descriptive-${{ github.run_id }}
          path: |
            results/v622/c1_km15_tuned_pooled_vs_species_descriptive.csv
            results/v622/c1_km15_descriptive_summary.json
          if-no-files-found: error
