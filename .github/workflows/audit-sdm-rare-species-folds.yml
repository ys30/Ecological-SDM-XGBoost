name: Audit Bayesian rare species by spatial fold
on:
  push:
    paths:
      - 'scripts/21_bayes_rare_species_fold_audit.py'
      - '.github/workflows/audit-sdm-rare-species-folds.yml'
      - 'results/bayes_spatial_cv_predictions.csv'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/21_bayes_rare_species_fold_audit.py
      - name: Publish fold audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/bayes_rare_species_fold_uncertainty.csv
          if ! git diff --cached --quiet; then
            git commit -m "Publish rare species uncertainty by spatial fold"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
