name: Second partition taxon exclusion audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/67_second_partition_taxon_exclusion.py'
      - '.github/workflows/second-partition-taxon-exclusion.yml'
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn tabulate
      - uses: actions/download-artifact@v4
        with:
          run-id: 41773784743
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: alternate-*
          path: downloaded
      - run: python scripts/67_second_partition_taxon_exclusion.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: second-partition-taxon-exclusion
          path: results/alternative_spatial_validation/
