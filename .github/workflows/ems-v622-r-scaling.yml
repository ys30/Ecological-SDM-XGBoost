name: EMS v6.22 R scaling parity and missingness audit
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/design_matrix.py'
      - 'experiments/v622/test_r_scaling_parity.py'
      - 'experiments/v622/audit_source_missingness.py'
      - '.github/workflows/ems-v622-r-scaling.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - run: python -m unittest discover -s experiments/v622 -p 'test_r_scaling_parity.py' -v
      - run: python -m experiments.v622.audit_source_missingness
      - uses: actions/upload-artifact@v4
        with:
          name: ems-v622-source-missingness
          path: results/v622/source_missingness_audit.json
