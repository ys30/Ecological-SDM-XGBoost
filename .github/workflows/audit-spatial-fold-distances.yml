name: Audit spatial fold geographic separation
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/40_audit_spatial_fold_distances.py'
      - 'results/spatial_2d_block_assignments.csv'
      - '.github/workflows/audit-spatial-fold-distances.yml'
permissions:
  contents: read
jobs:
  distances:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compute held-out plot nearest-training distances
        run: python3 scripts/40_audit_spatial_fold_distances.py
      - name: Upload five-fold distance statistics
        uses: actions/upload-artifact@v4
        with:
          name: spatial-fold-distance-audit
          path: results/spatial_fold_nearest_train_distances.csv
          if-no-files-found: error
