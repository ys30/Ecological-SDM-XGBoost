name: EMS v6.22 real input GLM wiring smoke
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/check_real_input_glm_smoke.py'
      - '.github/workflows/ems-v622-real-glm-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas scipy statsmodels
      - run: python -m experiments.v622.check_real_input_glm_smoke
