name: Evaluate SDM geographic longitude blocks
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/07_longitude_block_cv.R"
      - ".github/workflows/evaluate-sdm-longitude-blocks.yml"
      - "data/train.csv"
permissions:
  contents: write
concurrency:
  group: sdm-longitude-block-publication
  cancel-in-progress: false
jobs:
  geographic-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::xgboost
            any::ggplot2
            any::pROC
      - name: Run longitude-block cross-validation
        run: Rscript scripts/07_longitude_block_cv.R
      - name: Upload geographic CV artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdm-geographic-cv
          path: |
            results/longitude_block_cv_*.csv
            results/figures/09_*.png
            results/figures/10_*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Publish results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/sdm-geocv
          cp results/longitude_block_cv_*.csv /tmp/sdm-geocv/
          cp results/figures/09_*.png results/figures/10_*.png /tmp/sdm-geocv/
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p results/figures
            cp /tmp/sdm-geocv/*.csv results/
            cp /tmp/sdm-geocv/*.png results/figures/
            git add results/longitude_block_cv_*.csv results/figures/09_*.png results/figures/10_*.png
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish longitude-block SDM validation"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
