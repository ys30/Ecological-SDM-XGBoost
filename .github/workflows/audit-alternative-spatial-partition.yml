name: Audit alternative spatial five-fold partition
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/64_alternative_spatial_partition.py'
      - '.github/workflows/audit-alternative-spatial-partition.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas scikit-learn tabulate
      - run: python scripts/64_alternative_spatial_partition.py
      - uses: actions/upload-artifact@v4
        with:
          name: alternative-spatial-folds
          path: results/alternative_spatial_validation/
