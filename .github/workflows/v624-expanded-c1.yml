name: v6.24 expanded buffered XGBoost
on:
  push:
    branches: [research/v6.22-nested-spatial-tuning]
    paths:
      - '.github/workflows/v624-expanded-c1.yml'
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  expanded:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        outer: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 xgboost-cpu==3.1.3
      - run: python scripts/126_v624_nested_c1.py --expanded --outer ${{ matrix.outer }}
      - uses: actions/upload-artifact@v4
        with:
          name: expanded-c1-fold-${{ matrix.outer }}
          path: results/v624_c1_expanded/
          if-no-files-found: error
