name: v6.24 match verified XGBoost and comparator forecasts
on:
  push:
    branches: [research/v6.22-nested-spatial-tuning]
    paths:
      - '.github/workflows/v624-matched-integration.yml'
      - 'scripts/130_v624_integrate_matched.py'
permissions:
  contents: read
  actions: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      C1_RUN: '44908588964'
      COMPARATOR_RUN: '44909037033'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 xgboost-cpu==3.1.3
      - name: Require successful upstream run conclusions
        run: |
          gh run watch "$C1_RUN" --exit-status --interval 15
          gh run watch "$COMPARATOR_RUN" --exit-status --interval 15
      - uses: actions/download-artifact@v4
        with:
          pattern: v624-c1-622-*
          path: results/v624_c1/
          merge-multiple: true
          run-id: ${{ env.C1_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: v624-matched-comparator-outputs
          path: results/v624_comparators/
          run-id: ${{ env.COMPARATOR_RUN }}
          github-token: ${{ github.token }}
      - run: python scripts/130_v624_integrate_matched.py
      - uses: actions/upload-artifact@v4
        with:
          name: v624-matched-contrast-summary
          path: results/v624_matched_analysis/
          if-no-files-found: error
