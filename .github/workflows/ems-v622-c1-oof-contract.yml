name: EMS v6.22 C1 OOF contract
on:
  push:
    branches: [ems-v622-experiments]
    paths:
      - 'experiments/v622/validate_c1_oof.py'
      - 'experiments/v622/test_validate_c1_oof.py'
      - 'experiments/v622/run_c1_outer_grid.py'
      - '.github/workflows/ems-v622-c1-oof-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy pandas
      - run: python -m unittest experiments.v622.test_validate_c1_oof -v
