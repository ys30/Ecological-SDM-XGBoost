<svg xmlns="http://www.w3.org/2000/svg" width="920" height="350" viewBox="0 0 920 350" role="img" aria-labelledby="title desc"><title id="title">Leading model by within-taxon AUC across 23 spatial validation schemes</title><desc id="desc">GLM quadratic all-four predictors led 16 schemes; other quadratic regressions led three; other configurations led four. Based on v6.26m manuscript Results 3.3.</desc><rect width="920" height="350" rx="18" fill="#f7fafb"/><text x="40" y="57" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#173e60">Which model led under spatial validation?</text><text x="40" y="88" font-family="Arial,sans-serif" font-size="15" fill="#536579">23 schemes · within-taxon ROC AUC · v6.26m manuscript</text><rect x="40" y="119" width="840" height="60" rx="9" fill="#d9e5e9"/><path d="M49 119 H624 V179 H49 Q40 179 40 170 V128 Q40 119 49 119" fill="#087e7b"/><rect x="624" y="119" width="109.565" height="60" fill="#69b4ad"/><path d="M733.565 119 H871 Q880 119 880 128 V170 Q880 179 871 179 H733.565 Z" fill="#c9d5dc"/><text x="55" y="157" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">16 · GLM quad-4</text><text x="649" y="157" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#153d3b">3</text><text x="787" y="157" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#173e60">4</text><circle cx="50" cy="218" r="7" fill="#087e7b"/><text x="66" y="224" font-family="Arial,sans-serif" font-size="15" fill="#173e60">GLM quad-4: 16 / 23</text><circle cx="340" cy="218" r="7" fill="#69b4ad"/><text x="356" y="224" font-family="Arial,sans-serif" font-size="15" fill="#173e60">Other quadratic regression: 3 / 23</text><circle cx="50" cy="257" r="7" fill="#c9d5dc"/><text x="66" y="263" font-family="Arial,sans-serif" font-size="15" fill="#173e60">Other configurations: 4 / 23</text><text x="40" y="312" font-family="Arial,sans-serif" font-size="13" fill="#536579">Quadratic regression leads 19 / 23. Schemes reuse observations and are not independent trials.</text></svg>